<style>

<div id="stage">

  <div id="world">

    <div id="seat" class="win"><div class="bar"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i><div class="tt">oh-seat — the seat</div></div><div class="body"><pre id="seatpre"></pre></div></div>

<script>
// ───────────────────────── helpers ─────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  linear: (u) => u, appleOut: MO.appleOut, appleInOut: MO.appleInOut, whip: MO.whip, easeIn: MO.easeIn, easeOut: MO.easeOut, backOut: MO.backOut,
  expoIn: (u) => (u <= 0 ? 0 : u >= 1 ? 1 : (Math.pow(2, 10 * u) - 1) / 1023),
  expoOut: (u) => (u >= 1 ? 1 : 1 - Math.pow(2, -10 * u)),
  expoInOut: (u) => (u <= 0 ? 0 : u >= 1 ? 1 : u < 0.5 ? Math.pow(2, 20 * u - 10) / 2 : (2 - Math.pow(2, -20 * u + 10)) / 2),
};
const SPR = {}; const sp = (vd, b) => SPR[vd + ':' + b] || (SPR[vd + ':' + b] = MO.spring(vd, b));
const $ = (id) => document.getElementById(id);
function op(el, v) { el.style.opacity = (+v).toFixed(4); el.style.visibility = v <= 0.001 ? 'hidden' : 'visible'; }
const pending = [];
function setSrc(img, src) { if (img.dataset.src === src) return; img.dataset.src = src; img.src = src; pending.push(img.decode().catch(() => {})); }
const pad4 = (n) => String(n).padStart(4, '0');
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ───────────────────────── timeline (120 BPM: beat 0.5 s, bar 2 s) ─────────────────────────
const BEAT = 0.5, BAR = 2;
const T = { open: 0, thesis: 6, quote: 12, term: 16, split: 21, callers: 31, feat: 35, tag: 43, end: 45 };
T.dur = 53.5;
const OPEN_N = 180, END_N = 90;

// ───────────────────────── the caret: one Signal block carried through the film ─────────────────────────
// brand proportion: 2:1, sits on the baseline (cursor 62×31 against a 100 x-height → w = .578x, h = .289x)
const CARET = { x: 0, y: 0, w: 0, h: 0, o: 0 };
function caretSet(x, y, w, h, o = 1) { CARET.x = x; CARET.y = y; CARET.w = w; CARET.h = h; CARET.o = o; }
function drawCaret() {
  const c = $('caret');
  c.style.width = CARET.w.toFixed(2) + 'px'; c.style.height = CARET.h.toFixed(2) + 'px';
  c.style.transform = `translate(${CARET.x.toFixed(2)}px,${CARET.y.toFixed(2)}px)`;
  op(c, CARET.o);
}
const blink = (t, t0) => (t < t0 ? 1 : ((t - t0) % 1.0) < 0.5 ? 1 : 0);

// ───────────────────────── kinetic type blocks (screen space) ─────────────────────────
// a block: lines [{text, cls, t0, rate}] at (x,y). Characters reveal at `rate` chars/s; the caret rides the last one.
const KB = {};
function kblock(id, x, y, lines, opts = {}) {
  const el = document.createElement('div'); el.className = 'k'; el.id = id; $('fx').appendChild(el);
  el.style.left = x + 'px'; el.style.top = y + 'px'; if (opts.align === 'center') { el.style.left = '0'; el.style.width = '1920px'; el.style.textAlign = 'center'; }
  el.innerHTML = lines.map((l) => `<span class="ln ${l.cls}"><i class="bl" style="display:inline-block;width:0;height:0;vertical-align:baseline"></i>${[...l.text].map((c) => `<span class="ch">${esc(c)}</span>`).join('')}</span>`).join('');
  KB[id] = { el, lines, opts, chars: [...el.querySelectorAll('.ln')].map((ln) => [...ln.querySelectorAll('.ch')]), last: [] };
  return KB[id];
}
// reveal state; returns caret geometry (or null)
function kshow(id, t, caretLine = -1) {
  const B = KB[id]; let cg = null;
  B.lines.forEach((l, i) => {
    const n = l.rate === 0 ? (t >= l.t0 ? l.text.length : 0) : clamp(Math.floor((t - l.t0) * (l.rate || 40)) + 1, 0, [...l.text].length);
    const chs = B.chars[i];
    if (B.last[i] !== n) { chs.forEach((c, k) => { c.style.opacity = k < n ? 1 : 0; }); B.last[i] = n; }
    if ((caretLine === -1 && t >= l.t0) || caretLine === i) {
      const ln = B.el.children[i], bl = ln.querySelector('.bl').getBoundingClientRect();
      const fs = parseFloat(getComputedStyle(ln).fontSize);
      const x = n > 0 ? chs[n - 1].getBoundingClientRect().right : bl.left;
      cg = { x: x + fs * 0.08, base: bl.top, fs, typing: n < chs.length, done: n >= chs.length };
    }
  });
  return cg;
}
function caretOnType(cg, t, t0blink, o = 1) {
  if (!cg) return;
  const w = cg.fs * 0.30, h = cg.fs * 0.15;
  caretSet(cg.x, cg.base - h, w, h, o * (cg.typing ? 1 : blink(t, t0blink)));
}

// ───────────────────────── sections ─────────────────────────
// THESIS 6–12
function buildThesis() {
  kblock('th1', 200, 330, [
    { text: 'Anything that can sit at a terminal', cls: 'big', t0: 6.55, rate: 30 },
    { text: 'an AI agent. a script. a whole toolchain.', cls: 'mid', t0: 7.9, rate: 44 },
  ]);
  kblock('th2', 200, 380, [
    { text: 'can be an API.', cls: 'big', t0: 9.55, rate: 22 },
    { text: '万物皆可 2API — 都可以成为 API', cls: 'cn', t0: 10.35, rate: 0 },
  ]);
  KB.th1.el.children[1].style.color = 'var(--g2)'; KB.th1.el.children[1].style.marginTop = '14px';
  KB.th2.el.children[1].style.marginTop = '10px';
}
function drawThesis(t) {
  const a = KB.th1, b = KB.th2;
  const on1 = t >= T.thesis && t < 9.4, on2 = t >= 9.3 && t < T.quote + 0.05;
  op(a.el, on1 ? 1 - seg(t, 9.05, 9.35) : 0); op(b.el, on2 ? 1 : 0);
  if (on1) {
    a.el.style.transform = `translateY(${(-60 * E.expoIn(seg(t, 9.05, 9.4))).toFixed(1)}px)`;
    const cg = kshow('th1', t, t < 7.9 ? 0 : 1);
    if (t >= 6.55) caretOnType(cg, t, 8.9);
  }
  if (on2) {
    const cg = kshow('th2', t, 0);
    const cn = b.el.children[1]; cn.style.opacity = E.easeOut(seg(t, 10.35, 10.8)).toFixed(3);
    cn.style.transform = `translateY(${((1 - E.appleOut(seg(t, 10.35, 10.9))) * 16).toFixed(1)}px)`;
    if (t < 11.55) caretOnType(cg, t, 10.2);
    else {
      // carry → the caret glides to the quote's first character position, the Paper opens from it
      const u = E.appleInOut(seg(t, 11.55, 12.0));
      const w = cg.fs * 0.30, h = cg.fs * 0.15;
      const q = QSTART;
      caretSet(lerp(cg.x, q.x, u), lerp(cg.base - h, q.y, u), lerp(w, q.w, u), lerp(h, q.h, u), 1);
    }
    b.el.style.opacity = (1 - seg(t, 11.55, 11.8)).toFixed(3);
  }
  // 3D → caret: the full-frame Signal (camera inside the cursor) contracts to the typing caret
  if (t >= T.thesis && t < 6.55) {
    const tg = kshow('th1', 6.55, 0); kshow('th1', t, 0);
    const w1 = tg.fs * 0.30, h1 = tg.fs * 0.15, cx1 = tg.x - tg.fs * 0.08 + w1 / 2, cy1 = tg.base - h1 / 2;
    caretZoom(960, 540, 2100, 1240, cx1, cy1, w1, h1, E.expoOut(seg(t, T.thesis, 6.5)));
  }
}
// a rect morph in log-size space between a full-frame Signal field and a caret (centre-anchored)
function caretZoom(cx0, cy0, w0, h0, cx1, cy1, w1, h1, u) {
  const w = Math.exp(lerp(Math.log(w0), Math.log(w1), u)), h = Math.exp(lerp(Math.log(h0), Math.log(h1), u));
  const k = (w - w1) / Math.max(1e-6, w0 - w1);           // centre follows the size, so the field closes onto the caret
  const cx = lerp(cx1, cx0, k), cy = lerp(cy1, cy0, k);
  caretSet(cx - w / 2, cy - h / 2, w, h, 1);
}

// QUOTE 12–16 (Paper ground)
let QSTART = { x: 200, y: 560, w: 30, h: 15 };
function buildQuote() {
  kblock('qlab', 200, 300, [{ text: 'Tell your AI agent  ·  告诉你的 AI', cls: 'lbl', t0: 12.15, rate: 0 }]);
  kblock('q', 200, 380, [
    { text: '“Set up omni2api', cls: 'big ink', t0: 12.35, rate: 26 },
    { text: 'and make yourself the API.”', cls: 'big ink', t0: 13.05, rate: 30 },
  ]);
  const g = kshow('q', 12.35, 0); const fs = g.fs;
  QSTART = { x: g.x - fs * 0.08, y: g.base - fs * 0.15, w: fs * 0.30, h: fs * 0.15 };
}
function drawQuote(t) {
  const P = $('paper');
  const on = t >= T.quote - 0.05 && t < T.term + 0.6;
  op(KB.qlab.el, 0); op(KB.q.el, 0);
  if (!on) { op(P, 0); P.style.clipPath = 'none'; return; }
  // the Paper opens as a circle from the caret, and collapses into the terminal window at the end
  op(P, 1);
  const cx = QSTART.x + QSTART.w / 2, cy = QSTART.y + QSTART.h / 2;
  if (t < T.quote + 0.6) {
    const r = 2400 * E.expoIn(seg(t, T.quote - 0.05, T.quote + 0.35)) ** 0.7;
    P.style.clipPath = `circle(${r.toFixed(1)}px at ${cx}px ${cy}px)`;
  } else if (t < 15.55) P.style.clipPath = 'none';
  else {
    const u = E.expoInOut(seg(t, 15.55, 16.15));
    const R = winScreenRect(T.term + 0.001);
    const ins = [lerp(0, R[1], u), lerp(0, 1920 - R[0] - R[2], u), lerp(0, 1080 - R[1] - R[3], u), lerp(0, R[0], u)];
    P.style.clipPath = `inset(${ins[0].toFixed(1)}px ${ins[1].toFixed(1)}px ${ins[2].toFixed(1)}px ${ins[3].toFixed(1)}px round ${lerp(0, 22 * R[4], u).toFixed(1)}px)`;
    P.style.background = `rgb(${lerp(243, 27, u) | 0},${lerp(241, 28, u) | 0},${lerp(236, 32, u) | 0})`;
    if (t >= 16.15) op(P, 0);
  }
  if (t < 15.55) P.style.background = 'var(--paper)';
  const fo = 1 - seg(t, 15.5, 15.75);
  op(KB.qlab.el, E.easeOut(seg(t, 12.15, 12.5)) * fo);
  op(KB.q.el, fo);
  const cg = kshow('q', t, t < 13.05 ? 0 : 1);
  kshow('qlab', t);
  if (t >= T.quote && t < 15.55) caretOnType(cg, t, 14.0);
  // ⏎ at 15.5: the caret holds its place on screen; the terminal forms around it (carry)
  if (t >= 15.55 && t < T.term + 0.2) {
    const R = termCaretScreen(T.term + 0.001);
    const u = E.expoInOut(seg(t, 15.55, 16.15));
    const w = cg.fs * 0.30, h = cg.fs * 0.15;
    caretSet(lerp(cg.x, R.x, u), lerp(cg.base - h, R.y, u), lerp(w, R.w, u), lerp(h, R.h, u), 1);
  }
}

// ───────────────────────── world: terminals + camera ─────────────────────────
const MASK = 'ohk_35c6edb7••••••••••••••••';
// seat transcript: real output (omni2api 0.1.11 / oh-seat 0.2.3, captured 2026-10-23); long lines cut to the pane, keys masked
const SEAT = [
  { at: 16.1, cmd: 'omni2api up -d', rate: 26 },
  { at: 16.85, out: '' },
  { at: 16.85, out: 'Omni2API is up.', cls: 'h' },
  { at: 16.85, out: '' },
  { at: 16.92, out: '  Caller config (OpenAI-compatible, or Anthropic at the same base):', cls: 'dim' },
  { at: 16.99, out: '    base_url  (local)  http://127.0.0.1:8080/v1', id: 'local' },
  { at: 17.06, out: '    base_url  (public) https://sms-payday-pump-advocate.trycloudflare.com/v1', id: 'public' },
  { at: 17.13, out: '    api_key            ' + MASK, id: 'key' },
  { at: 17.2, out: '    model              omni2api', id: 'model' },
  { at: 17.2, out: '' },
  { at: 19.0, cmd: 'oh-seat name anything', rate: 32 },
  { at: 19.75, out: 'model: anything', id: 'name' },
  { at: 20.25, cmd: 'oh-seat next', rate: 30 },
  // ── split: Claude Code's request lands
  { at: 23.5, out: 'NEW CONVERSATION conv=cnv_01a1689b4c3372d38f7c65f1b92384a5', cls: 'dim' },
  { at: 23.5, out: 'MESSAGE conv=cnv_01a1689b4c3372d38f7c65f1b92384a5 client=claude_code', cls: 'h', id: 'msg' },
  { at: 23.5, out: 'What is ./omni2api, in one line?', cls: 'c', id: 'ask' },
  { at: 23.62, out: 'tools in cnv_01a1689b4c33… (13; * = required; system prompt 15823 chars)', cls: 'dim', id: 'tools' },
  { at: 23.68, out: '  Agent(description*: string, prompt*: string, effort: string, …)' },
  { at: 23.72, out: '  Bash(command*: string, dangerouslyDisableSandbox: boolean, description…)', id: 'bash' },
  { at: 23.76, out: '  Edit(file_path*: string, new_string*: string, old_string*: string, …)' },
  { at: 23.80, out: '  Read(file_path*: string, allow_large: boolean, limit: integer, …)' },
  { at: 23.84, out: '  Write(content*: string, file_path*: string)   … and 8 more' },
  { at: 23.88, out: '  caller env: cwd=…/session/cc  platform=linux  shell=bash', cls: 'dim' },
  { at: 24.55, cmd: 'oh-seat tool Bash command="grep -m1 \'###\' omni2api/README.md" description="Read the tagline"', rate: 110, id: 'tool' },
  { at: 26.95, out: 'TOOL RESULT Bash status=success id=call_01a1689ba7b97e63b2184fdb98741c0e', cls: 'h', id: 'res' },
  { at: 26.95, out: '### Anything to API — 万物皆可 2API', cls: 'c', id: 'resv' },
  { at: 27.35, cmd: 'oh-seat reply "Anything to API — it turns whatever sits in its seat into an OpenAI/Anthropic-compatible model. Right now, that\'s me."', rate: 150, id: 'reply' },
  { at: 28.85, out: 'replied conv=cnv_01a1689b4c3372d38f7c65f1b92384a5 (delivered live)', cls: 'dim', id: 'replied' },
  { at: 29.0, cmd: 'oh-seat next', rate: 30 },
];
const SEAT_COLS = 86, SEAT_ROWS = 17, SEAT_LH = 36; let SEAT_CW = 24 * 0.6, CC_CW = 22.6 * 0.6;
function wrapRows(s, cols) { const r = []; const a = [...s]; if (!a.length) return ['']; for (let i = 0; i < a.length; i += cols) r.push(a.slice(i, i + cols).join('')); return r; }
let seatKey = '';
// returns {rows:[{html}], caret:{row,col}|null, idRow:{id:row}}
function seatState(t) {
  const rows = []; const idRow = {}; let caret = null;
  for (let i = 0; i < SEAT.length; i++) {
    const e = SEAT[i]; if (t < e.at) break;
    if (e.cmd !== undefined) {
      const n = Math.min([...e.cmd].length, Math.floor((t - e.at) * e.rate));
      const typed = [...e.cmd].slice(0, n).join('');
      const full = '$ ' + typed; const wr = wrapRows(full, SEAT_COLS);
      if (e.id) idRow[e.id] = rows.length;
      wr.forEach((w, k) => rows.push(k === 0 ? `<span class="p">$</span> <span class="c">${esc(w.slice(2))}</span>` : `<span class="c">${esc(w)}</span>`));
      const nxt = SEAT[i + 1];
      if (!nxt || t < nxt.at) { const last = wr[wr.length - 1]; caret = { row: rows.length - 1, col: [...last].length, typing: n < [...e.cmd].length, t0: e.at + [...e.cmd].length / e.rate }; }
    } else {
      if (e.id) idRow[e.id] = rows.length;
      const s = [...e.out].length > SEAT_COLS ? [...e.out].slice(0, SEAT_COLS - 1).join('') + '…' : e.out;
      rows.push(e.cls ? `<span class="${e.cls}">${esc(s)}</span>` : esc(s));
    }
  }

  mk('f1b', `<div class="mono" style="font-size:27px;line-height:42px;color:#B9BCC2;white-space:pre">${esc('{ "finish_reason": "tool_calls",\n  "tool_calls": [{ "id": "call_01a16890189a7db19272774b964e3480",\n    "function": { "name": "bash",\n      "arguments": "{\\"command\\":\\"find omni2api/server/src … | wc -l\\"}" } }] }')}</div>`, 'left:140px;top:640px');
  mk('f1c', `<div class="mono" style="font-size:22px;color:var(--graphite)">OpenAI Python SDK → the tool ran in the caller's own shell · exit=0 · 19989</div>`, 'left:140px;top:860px');

}
function drawFeat(t) {

  for (const id of ['f0a', 'f0b', 'f0c', 'f1a', 'f1b', 'f1c', 'f2a', 'f2b', 'f3a']) op($(id), 0);
  if (!on) return;
  const i = clamp(Math.floor((t - T.feat) / 2), 0, 3), f = FEATS[i], lt = t - f.t0;
  const B = KB['f' + i];
  const fo = 1 - seg(lt, 1.82, 1.98);
  op(B.el, fo);
  const cg = kshow('f' + i, t, 0);
  B.el.children[1].style.opacity = E.easeOut(seg(lt, 0.4, 0.7)).toFixed(3);
  const isLast = i === 3;
  if (lt < 1.82 || isLast) caretOnType(cg, t, f.t0 + 0.5);
  else { // the caret slides to the next heading's start
    const g = kshow('f' + (i + 1), FEATS[i + 1].t0 + 0.001, 0);
    const u = E.appleInOut(seg(lt, 1.82, 2.0));
    caretSet(lerp(cg.x, g.x - g.fs * 0.08, u), lerp(cg.base - cg.fs * 0.15, g.base - g.fs * 0.15, u), cg.fs * 0.3, cg.fs * 0.15, 1);
  }

  if (i === 0) {
    rise($('f0b'), 0.2); rise($('f0a'), 0.25);
    // the 13 schemas compress into the one line the user typed
    const c = E.expoInOut(seg(lt, 0.85, 1.35));
    const a = $('f0a'); a.style.transform = `translateY(${(120 * c).toFixed(1)}px) scaleY(${(1 - 0.97 * c).toFixed(4)})`; a.style.transformOrigin = '0 0';
    op(a, (1 - seg(lt, 1.2, 1.4)) * E.easeOut(seg(lt, 0.25, 0.5)) * fo);
    op($('f0b'), E.easeOut(seg(lt, 0.2, 0.5)) * (1 - seg(lt, 0.85, 1.1)) * fo);
    const u = E.appleOut(seg(lt, 1.25, 1.6)); op($('f0c'), u * fo); $('f0c').style.transform = `translateY(${((1 - u) * -30).toFixed(1)}px)`;
  } else if (i === 1) {

    const u = E.appleOut(seg(lt, 0.7, 1.15)); op($('f1b'), u * fo); $('f1b').style.transform = `translateY(${((1 - u) * 30).toFixed(1)}px)`;
    rise($('f1c'), 1.05, 12);
  } else if (i === 2) {

    const k = clamp(Math.floor((lt - 0.45) / 0.105) + 1, 0, SSE.length);
    const lines = []; for (let j = 0; j < k; j++) lines.push(`data: {"id":"chatcmpl-01a16890bcab7f90826c94b532eddbd7","object":"chat.completion.chunk","model":"anything","choices":[{"index":0,"delta":{"content":${JSON.stringify(SSE[j])}}}]}`);
    if (k === SSE.length && lt > 1.75) lines.push('data: [DONE]');
    $('sseLines').textContent = lines.slice(-9).join('\n');
    rise($('f2a'), 0.3, 10);
    op($('f2b'), fo);
    const big = $('sseBig'); const txt = SSE.slice(0, k).join('');
    if (big.dataset.k !== String(k)) { big.dataset.k = k; big.innerHTML = `<i class="bl" style="display:inline-block;width:0;height:0;vertical-align:baseline"></i>${esc(txt)}<i class="end" style="display:inline-block;width:0;height:0"></i>`; }
  } else if (i === 3) {
    const n = clamp(Math.floor((lt - 0.35) / 0.12) + 1, 0, CONVS.length);
    const el = $('convs');
    if (el.dataset.n !== String(n)) { el.dataset.n = n; el.innerHTML = CONVS.slice(0, n).map((c, j) => `<span style="color:${j === 0 ? 'var(--paper)' : '#7D8088'}">${j === 0 ? '*' : ' '} ${c[0]}</span>  <span style="color:var(--paper)">${c[1].padEnd(14)}</span>  ${esc(c[2])}`).join('\n'); }
    op($('f3a'), (n > 0 ? 1 : 0) * fo);

    if (bl && en) { const b = bl.getBoundingClientRect(), e = en.getBoundingClientRect(); const fs = 70; caretSet(e.left + fs * 0.08, b.top - fs * 0.15, fs * 0.3, fs * 0.15, 1); }

}

// ───────────────────────── TAG 43–45 ─────────────────────────
function buildTag() {
  kblock('tg', 0, 380, [{ text: 'Make yourself the API.', cls: 'big', t0: 43.12, rate: 30 }, { text: '把自己，变成 API', cls: 'cn', t0: 43.95, rate: 0 }], { align: 'center' });
  KB.tg.el.children[0].style.fontSize = '120px';
}
function drawTag(t) {
  const on = t >= T.tag && t < T.end + 0.02; op(KB.tg.el, 0);
  if (!on) return;
  op(KB.tg.el, 1 - seg(t, 44.62, 44.75));
  const cg = kshow('tg', t, 0);
  const cn = KB.tg.el.children[1]; cn.style.opacity = E.easeOut(seg(t, 43.95, 44.3)).toFixed(3);
  if (t < 43.12) { const g = kshow('tg', 43.12, 0), f = FEAT_CARET0(); const prev = KB.f3; const pg = kshow('f3', 42.9, 0); const u = E.appleInOut(seg(t, T.tag, 43.12)); caretSet(lerp(pg.x, g.x - g.fs * 0.08, u), lerp(pg.base - pg.fs * 0.15, g.base - g.fs * 0.15, u), lerp(pg.fs * 0.3, g.fs * 0.3, u), lerp(pg.fs * 0.15, g.fs * 0.15, u), 1); }

// ───────────────────────── 3D + END ─────────────────────────
const LK = { s: 880 / 1080.3, x0: 500.45, y0: 407.42 };
const GL = [103.2, 260.8, 380.8, 423.8, 540.62, 656.02, 781.22, 820.82];   // wordmark glyph right edges (wordmark units)
function buildLock() {
  fetch('lockup.svg').then((r) => r.text()).then((s) => {
    const w = $('lockwrap');
    w.innerHTML = s.replace('<svg ', '<svg id="lock" ');
    const svg = w.querySelector('svg'); const paths = svg.querySelectorAll('path');
    paths[0].id = 'lring'; paths[1].id = 'lcur'; paths[2].id = 'lword';
    const NS = 'http://www.w3.org/2000/svg';
    const cp = document.createElementNS(NS, 'clipPath'); cp.id = 'wclip'; const r = document.createElementNS(NS, 'rect'); r.id = 'wrect';
    r.setAttribute('x', -4); r.setAttribute('y', -170); r.setAttribute('height', 240); r.setAttribute('width', 0); cp.appendChild(r);
    const defs = document.createElementNS(NS, 'defs'); defs.appendChild(cp); svg.insertBefore(defs, svg.firstChild);
    paths[2].setAttribute('clip-path', 'url(#wclip)');

}
function draw3D(t) {
  const img = $('img3d');
  if (t < T.thesis) { setSrc(img, `frames/open/${pad4(clamp(Math.round(t * 30), 0, OPEN_N - 1))}.jpg`); op(img, 1); }
  else if (t >= T.end && t < T.end + 2.75) { setSrc(img, `frames/end/${pad4(clamp(Math.round((t - T.end) * 30), 0, END_N - 1))}.jpg`); op(img, 1 - seg(t, T.end + 2.45, T.end + 2.7)); }
  else op(img, 0);
}
function drawEnd(t) {
  const w = $('lockwrap'), svg = $('lock');
  op($('fade'), seg(t, T.dur - 0.7, T.dur));
  if (!svg || t < T.end + 2.4) { op(w, 0); op($('tag'), 0); op($('url'), 0); return; }
  op(w, 1);
  svg.style.transform = `translate(${LK.x0}px,${LK.y0}px) scale(${LK.s})`; svg.style.position = 'absolute'; svg.style.transformOrigin = '0 0';
  // the cursor types its own name along the baseline, then goes home
  const T0 = T.end + 2.75, DT = 0.125;
  const k = Math.floor((t - T0) / DT) + 1;          // glyphs typed
  let cx = 175.99, rw = 0;
  if (t >= T0) {
    const n = clamp(k, 0, 8);
    rw = n > 0 ? GL[n - 1] + 8 : 0;
    const prev = n > 1 ? GL[n - 2] : null;
    const tgt = n > 0 ? 283.48 + GL[n - 1] + 14 : 175.99;
    const from = n > 1 ? 283.48 + GL[n - 2] + 14 : 175.99;
    const u = E.expoOut(clamp(((t - T0) - (n - 1) * DT) / (DT * 0.7)));
    cx = n >= 1 ? lerp(from, tgt, u) : 175.99;
    const back = T0 + 8 * DT + 0.18;
    if (t >= back) cx = lerp(283.48 + GL[7] + 14, 175.99, E.expoInOut(seg(t, back, back + 0.42)));
  }
  if (t >= T0 && t < T0 + 8 * DT + 0.18) rw = Math.max(0, cx - 283.48 - 14 + 2);
  if (t >= T0 + 8 * DT + 0.18) rw = GL[7] + 8;
  $('wrect').setAttribute('width', rw.toFixed(2));
  $('lcur').setAttribute('transform', `translate(${(cx - 175.99).toFixed(2)} 0)`);
  // wink: two blinks once home (o_ is a face)
  const tw = T0 + 8 * DT + 0.18 + 0.42;
  const wink = (t > tw + 1.3 && t < tw + 1.42) || (t > tw + 1.62 && t < tw + 1.74);
  $('lcur').style.opacity = wink ? 0 : 1;
  const tg = E.appleOut(seg(t, tw + 0.05, tw + 0.75));
  op($('tag'), tg); $('tag').style.transform = `translateY(${((1 - tg) * 16).toFixed(1)}px)`;
  op($('url'), 0.95 * E.easeOut(seg(t, tw + 0.45, tw + 1.05)));
}

// ───────────────────────── seek ─────────────────────────
const Q = new URLSearchParams(location.search);
window.__seek = async (t) => {
  pending.length = 0; CARET.o = 0;
  draw3D(t); drawThesis(t); drawQuote(t); drawWorld(t); drawCaps(t); drawCallers(t); drawFeat(t); drawTag(t); drawEnd(t);
  if (t < T.thesis || t >= T.end) CARET.o = 0;

  if (Q.has('hud')) { $('hud').style.display = 'block'; $('hud').textContent = t.toFixed(3); }
  await Promise.all(pending);
  return true;
};
window.__meta = { dur: T.dur, fps: 30 };
window.__events = () => {

  ['th1', 'th2', 'q', 'tg', 'f0', 'f1', 'f2', 'f3'].forEach(typeEv);
  add(12.0, 'paper'); add(15.5, 'enter'); add(16.0, 'carry');
  for (const e of SEAT) if (e.cmd) { const n = [...e.cmd].length; const step = Math.max(1, Math.round(e.rate / 22)); for (let i = 0; i < n; i += step) add(e.at + i / e.rate, 'key', { soft: 1 }); add(e.at + n / e.rate + 0.12, 'enter', { soft: 1 }); }
  for (let i = 0; i < ASK.length; i += 2) add(21.85 + i / 30, 'key', { soft: 1 }); add(23.0, 'enter', { soft: 1 });
  add(T.split, 'slide'); for (const [t0] of PK) add(t0, 'packet');
  add(16.85, 'out'); add(23.5, 'out'); add(26.95, 'out'); add(28.95, 'out');
  add(T.callers, 'carry'); for (let k = 0; k < 13; k++) add(31.25 + k * 0.25, 'hit', { k });

window.__motion = (t0, t1) => {

  }

};
